; S3Drive - ESP32-S3 N16R8 as fast USB file storage
; Flash/monitor via the UART port (COM4, FT232R); data via the native USB port (WinUSB vendor device).
[env:s3drive]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = partitions.csv
upload_port = COM4
upload_speed = 921600
monitor_port = COM4
monitor_speed = 115200
build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
